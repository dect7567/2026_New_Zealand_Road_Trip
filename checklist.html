    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">

  <body>
    <a class="skip-link" href="#mainContent">跳到主要內容</a>
    <main id="mainContent" tabindex="-1" class="reference-shell">
      <header class="reference-header">
        <p class="eyebrow">南島旅行手帳</p>
        <h1>行前清單</h1>
        <p class="sample-note">範例內容，待補</p>
        <p>把出發前的小事逐一收好。勾選結果保留在此瀏覽器，與入境清單分開儲存。</p>
      </header>
      <section class="travel-checklist" data-checklist="departure" aria-label="行前準備清單"><p class="checklist-status" role="status" aria-live="polite"></p><label class="checklist-row" for="departure-1"><input id="departure-1" type="checkbox"><span><strong>護照與旅行文件</strong><small>檢查證件、簽證或入境許可；各項要求待確認。</small></span></label><label class="checklist-row" for="departure-2"><input id="departure-2" type="checkbox"><span><strong>駕照與租車文件</strong><small>準備租車合約、駕駛相關文件；適用文件待確認。</small></span></label><label class="checklist-row" for="departure-3"><input id="departure-3" type="checkbox"><span><strong>機票、住宿與保險</strong><small>下載訂位資料與保單，另存離線副本。</small></span></label><label class="checklist-row" for="departure-4"><input id="departure-4" type="checkbox"><span><strong>網路與離線地圖</strong><small>準備通訊方案，下載沿途所需地圖。</small></span></label><label class="checklist-row" for="departure-5"><input id="departure-5" type="checkbox"><span><strong>衣物、藥品與個人用品</strong><small>整理分層衣物、雨具、個人藥品與充電用品；清單待補。</small></span></label><label class="checklist-row" for="departure-6"><input id="departure-6" type="checkbox"><span><strong>露營車取車準備</strong><small>整理車況、設備操作與還車事項的確認清單；細節待補。</small></span></label></section>
    </main>

<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Day 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body data-day-page="3">
    <a class="skip-link" href="#dayPrimarySection">跳到主要行程</a>
    <div class="day-scroll">
    <header class="day-page-hero">
      <nav class="day-nav" aria-label="行程導覽">
        <a class="ghost-button ghost-button--light" href="../index.html">返回首頁</a>
        <a id="mapsLink" class="map-button" target="_blank" rel="noreferrer">開啟地圖</a>
      </nav>
      <img id="dayHeroImage" class="day-page-hero__image" width="1536" height="1024" alt="" fetchpriority="high">
      <div class="day-page-hero__content">
        <p id="detailDate" class="eyebrow"></p>
        <h1 id="detailTitle"></h1>
      </div>
    </header>
    <main class="day-page-main">
      <div id="routeStrip" class="route-strip"></div>
      <nav class="section-nav" aria-label="頁內行程導覽"><a href="#dayPrimarySection">主要行程</a><a href="#dayAlternativeSection">其他替代方案</a><a href="#dayFoodSection">美食</a><a href="#daySupplySection">採買及加油</a><a href="#dayCampSection">住宿</a></nav>
      <div class="day-info-grid">
        <section id="dayPrimarySection" tabindex="-1" class="day-info-card">
          <h2>主要行程</h2>
          <div id="dayPrimaryList" class="info-list"></div>
        </section>
        <section id="dayAlternativeSection" class="day-info-card">
          <h2>其他替代方案</h2>
          <div id="dayAlternativeList" class="info-list"></div>
        </section>
        <section id="dayFoodSection" class="day-info-card day-info-card--food">
          <h2>美食</h2>
          <div id="dayFoodList" class="info-list"></div>
        </section>
        <section id="daySupplySection" class="day-info-card day-info-card--supply">
          <h2>採買及加油建議</h2>
          <div id="daySupplyList" class="info-list"></div>
        </section>
        <section id="dayCampSection" class="day-info-card day-info-card--wide">
          <h2 id="dayCampHeading">營地建議</h2>
          <div id="dayCampList" class="camp-list"></div>
        </section>
      </div>
    </main>
    </div>
    <div class="day-pager-shell">
      <nav id="dayPager" class="day-pager" aria-label="前後日期"></nav>
    </div>
    <script src="../app.js?v=20261112-ui-v3"></script>
  </body>
</html>

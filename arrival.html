    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">

  <body>
    <a class="skip-link" href="#mainContent">跳到主要內容</a>
    <main id="mainContent" tabindex="-1" class="reference-shell">
      <header class="reference-header">
        <p class="eyebrow">南島旅行手帳</p>
        <h1>入境須知</h1>
        <p class="sample-note">範例內容，待補</p>
        <p>逐項整理入境前要確認的文件。勾選結果保留在此瀏覽器；資格、費用與申報時程待確認。</p>
      </header>
      <section class="travel-checklist" data-checklist="arrival" aria-label="入境準備清單"><p class="checklist-status" role="status" aria-live="polite"></p><label class="checklist-row" for="arrival-1"><input id="arrival-1" type="checkbox"><span><strong>NZeTA</strong><small>確認同行者適用資格與申請狀態；詳細步驟待補。</small></span></label><label class="checklist-row" for="arrival-2"><input id="arrival-2" type="checkbox"><span><strong>IVL</strong><small>確認適用情況與繳費狀態；費用待確認。</small></span></label><label class="checklist-row" for="arrival-3"><input id="arrival-3" type="checkbox"><span><strong>生物安全申報</strong><small>整理食品、藥品與戶外裝備清單；申報細節待補。</small></span></label><label class="checklist-row" for="arrival-4"><input id="arrival-4" type="checkbox"><span><strong>NZTD 電子入境卡</strong><small>確認填寫內容與提交時程；官方連結待補。</small></span></label></section>
    </main>
